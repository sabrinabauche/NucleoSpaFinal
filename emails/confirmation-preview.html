<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="es">
  <head>
    <meta content="width=device-width" name="viewport" />
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta content="telephone=no,address=no,email=no,date=no,url=no" name="format-detection" />
    <style>
      @media (prefers-color-scheme: dark){li::marker{color:#c4c4c4}}
    </style>
  </head>
  <body
    dir="ltr"
    lang="es"
    style="background-color:#f7f5f3;margin:0;padding-top:0;padding-bottom:0;padding-right:0;padding-left:0"
  >
    <!--$--><!--html--><!--head--><!--body-->
    <table border="0" width="100%" cellpadding="0" cellspacing="0" role="presentation" align="center">
      <tbody>
        <tr>
          <td
            dir="ltr"
            lang="es"
            style="background-color:#f7f5f3;margin:0px;padding-top:0px;padding-right:0px;padding-bottom:0px;padding-left:0px"
          >
            <table
              align="left"
              width="100%"
              border="0"
              cellpadding="0"
              cellspacing="0"
              role="presentation"
              style="max-width:580px;align:left;width:100%;background-color:#ffffff;border-radius:0px"
            >
              <tbody>
                <tr style="width:100%">
                  <td style="padding-top:0px;padding-right:0px;padding-bottom:0px;padding-left:0px">
                    <table
                      width="100%"
                      border="0"
                      cellpadding="0"
                      cellspacing="0"
                      role="presentation"
                      style="margin-top:0;margin-right:0;margin-bottom:0;margin-left:0;padding-top:0;padding-right:0;padding-bottom:0;padding-left:0"
                    >
                      <tbody>
                        <tr style="margin:0;padding:0">
                          <td
                            align="center"
                            data-id="__react-email-column"
                            style="margin:0;padding:40px 16px 48px;background-color:#f7f5f3"
                          >
                            <table
                              width="580"
                              border="0"
                              cellpadding="0"
                              cellspacing="0"
                              role="presentation"
                              style="margin-top:0;margin-right:0;margin-bottom:0;margin-left:0;padding-top:0;padding-right:0;padding-bottom:0;padding-left:0;max-width:580px;width:100%;background:#ffffff"
                            >
                              <tbody>
                                <tr style="margin:0;padding:0">
                                  <td
                                    data-id="__react-email-column"
                                    style="margin:0;padding:0;font-size:0;line-height:0"
                                  >
                                    <img
                                      alt="Núcleo Clinique"
                                      src="https://resend-attachments.s3.amazonaws.com/713841b0-5af6-482c-a619-5e00749e4773"
                                      style="display:block;outline:none;border:none;text-decoration:none;max-width:580px;height:auto;width:100%"
                                      width="580"
                                    />
                                  </td>
                                </tr>
                                <tr style="margin:0;padding:0">
                                  <td data-id="__react-email-column" style="margin:0;padding:0 52px">
                                    <div style="margin:0;padding:0;height:1px;background:#ece8e3"></div>
                                  </td>
                                </tr>
                                <tr style="margin:0;padding:0">
                                  <td data-id="__react-email-column" style="margin:0;padding:36px 52px 28px">
                                    <p
                                      style="margin:0 0 6px;padding:0;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#c4a87a;line-height:1"
                                    >
                                      Confirmación de cita
                                    </p>
                                    <p
                                      style="margin:0;padding:0;font-family:&#x27;Georgia&#x27;,&#x27;Times New Roman&#x27;,serif;font-size:24px;color:#1a1008;line-height:1.3;font-weight:400"
                                    >
                                      Hola, {{firstName}}.
                                    </p>
                                  </td>
                                </tr>
                                <tr style="margin:0;padding:0">
                                  <td data-id="__react-email-column" style="margin:0;padding:0 52px 36px">
                                    <table
                                      width="100%"
                                      border="0"
                                      cellpadding="0"
                                      cellspacing="0"
                                      role="presentation"
                                      style="margin-top:0;margin-right:0;margin-bottom:0;margin-left:0;padding-top:0;padding-right:0;padding-bottom:0;padding-left:0"
                                    >
                                      <tbody>
                                        <tr style="margin:0;padding:0">
                                          <td
                                            data-id="__react-email-column"
                                            style="margin:0;padding:0;padding-bottom:20px;border-bottom:1px solid #ece8e3"
                                          >
                                            <p
                                              style="margin:0 0 6px;padding:0;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#b0a090;line-height:1"
                                            >
                                              Tratamiento
                                            </p>
                                            <p
                                              style="margin:0;padding:0;font-family:&#x27;Georgia&#x27;,&#x27;Times New Roman&#x27;,serif;font-size:16px;color:#1a1008;line-height:1.5"
                                            >
                                              {{treatmentList}}
                                            </p>
                                          </td>
                                        </tr>
                                        <tr style="margin:0;padding:0">
                                          <td
                                            data-id="__react-email-column"
                                            style="margin:0;padding:0;padding-top:20px"
                                          >
                                            <table
                                              width="100%"
                                              border="0"
                                              cellpadding="0"
                                              cellspacing="0"
                                              role="presentation"
                                              style="margin-top:0;margin-right:0;margin-bottom:0;margin-left:0;padding-top:0;padding-right:0;padding-bottom:0;padding-left:0"
                                            >
                                              <tbody>
                                                <tr style="margin:0;padding:0">
                                                  <td data-id="__react-email-column" style="margin:0;padding:0">
                                                    <p
                                                      style="margin:0 0 6px;padding:0;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#b0a090;line-height:1"
                                                    >
                                                      Fecha
                                                    </p>
                                                    <p
                                                      style="margin:0;padding:0;font-size:14px;color:#1a1008;line-height:1.5"
                                                    >
                                                      {{dateFormatted}}
                                                    </p>
                                                  </td>
                                                  <td data-id="__react-email-column" style="margin:0;padding:0">
                                                    <p
                                                      style="margin:0 0 6px;padding:0;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#b0a090;line-height:1"
                                                    >
                                                      Horario
                                                    </p>
                                                    <p
                                                      style="margin:0;padding:0;font-size:14px;color:#1a1008;line-height:1.5"
                                                    >
                                                      {{startTime}} – {{endTime}} hrs
                                                    </p>
                                                  </td>
                                                </tr>
                                              </tbody>
                                            </table>
                                          </td>
                                        </tr>
                                      </tbody>
                                    </table>
                                  </td>
                                </tr>
                                <tr style="margin:0;padding:0">
                                  <td data-id="__react-email-column" style="margin:0;padding:0 52px 44px">
                                    <table
                                      border="0"
                                      cellpadding="0"
                                      cellspacing="0"
                                      role="presentation"
                                      style="margin-top:0;margin-right:0;margin-bottom:0;margin-left:0;padding-top:0;padding-right:0;padding-bottom:0;padding-left:0"
                                    >
                                      <tbody>
                                        <tr style="margin:0;padding:0">
                                          <td
                                            data-id="__react-email-column"
                                            style="margin:0;padding:0;background:#1a1008"
                                          >
                                            <p style="margin:0;padding:0">
                                              <a
                                                href="{{waUrl}}"
                                                rel="noopener noreferrer"
                                                style="color:#c4a87a;text-decoration-line:none;text-decoration:none;display:inline-block;padding:14px 32px;font-size:10px;letter-spacing:3px;text-transform:uppercase;font-family:Arial,Helvetica,sans-serif"
                                                target="_blank"
                                                >Confirmar mi cita</a
                                              >
                                            </p>
                                          </td>
                                        </tr>
                                      </tbody>
                                    </table>
                                  </td>
                                </tr>
                                <tr style="margin:0;padding:0">
                                  <td
                                    data-id="__react-email-column"
                                    style="margin:0;padding:20px 52px;border-top:1px solid #ece8e3"
                                  ></td>
                                </tr>
                              </tbody>
                            </table>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </tbody>
    </table>
    <!--/$-->
  </body>
</html>
